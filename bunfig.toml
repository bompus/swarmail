[install]
exact = true
# Scripts run as `bun scripts/<script>.ts` from this checkout: never install a missing import on the fly.
auto = "disable"
# Three days, so a compromised release is usually pulled before it lands here. Seconds, not "3d": Bun 1.4.2, the
# oldest version package.json allows, rejects a duration string and refuses to read this file.
minimumReleaseAge = 259200
minimumReleaseAgeExcludes = ["@types/bun", "bun-types", "typescript"]
