name: Release
# Publishes a release when a version tag is pushed: the npm package `swarmail-mcp` through npm trusted publishing (no stored
# token), the MCP registry entry through the registry's GitHub OIDC login, and the GitHub release. CONTRIBUTING.md "Releasing"
# says how to cut one. npm must list this repository and workflow file as the package's trusted publisher.
# Run by hand (Actions, Release, Run workflow, on main) with an existing tag to finish a release that stopped part way: a
# tag's own copy of this file is the one from its commit, so a fix to this file reaches an old tag only this way.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release, such as v0.8.0
        required: true
        type: string
permissions:
  contents: read
env:
  TAG: ${{ inputs.tag || github.ref_name }}
# One release at a time. A started publish is never cancelled, and tags pushed while one runs wait their turn
# (queue: max) instead of replacing each other.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.guard.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - name: The tag names the version in package.json and is on main
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Run this workflow on main, not on $GITHUB_REF" >&2
            exit 1
          fi
          version="$(jq -r .version package.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match version $version in package.json" >&2
            exit 1
          fi
          # "behind" or "identical": the tagged commit is part of main's history, so only reviewed code is published.
          sha="$(git rev-parse HEAD)"
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$sha" --jq .status)"
          if [ "$status" != "behind" ] && [ "$status" != "identical" ]; then
            echo "Commit $sha is not on main (compare status: $status)" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install shellcheck and shfmt
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.gz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz
          echo "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6  $RUNNER_TEMP/shellcheck.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/shellcheck.tar.gz" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" "$bin/"
          curl -fsSL -o "$bin/shfmt" https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          echo "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf  $bin/shfmt" | sha256sum -c -
          chmod +x "$bin/shfmt"
          echo "$bin" >> "$GITHUB_PATH"
      - run: bun run check
      - run: bun test

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing, npm provenance and the MCP registry login
    env:
      MCP_PUBLISHER_VERSION: v1.8.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }} # the commit the check job validated, even if the tag moved since
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # Before anything is published: the GitHub release notes are the CHANGELOG section for this version.
      - name: Extract the release notes
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          awk -v heading="## $version - " 'index($0, heading) == 1 { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md |
            sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "CHANGELOG.md has no section headed \"$version - <date>\", or it is empty" >&2
            exit 1
          fi
      # Node is here only for npm: trusted publishing needs npm 11.5.1 or later, which Bun does not provide.
      # Node 24.22.2 ships npm 11.19.1.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - name: Check the npm version
        run: |
          set -euo pipefail
          have="$(npm --version)"
          if [ "$(printf '%s\n%s\n' 11.5.1 "$have" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "npm $have is older than 11.5.1, which trusted publishing needs" >&2
            exit 1
          fi
      - name: Publish swarmail-mcp to npm
        working-directory: packages/mcp-relay
        run: |
          set -euo pipefail
          name="$(jq -r .name package.json)"
          version="$(jq -r .version package.json)"
          # Skip a version npm already has, so a run for a tag whose npm publish succeeded fills in only what is missing.
          if timeout 30 npm view "$name@$version" version >/dev/null 2>&1; then
            echo "skip $name@$version (already published)"
          else
            npm publish --provenance --access public
          fi
      - name: Wait until npm shows the version
        working-directory: packages/mcp-relay
        run: |
          set -euo pipefail
          name="$(jq -r .name package.json)"
          version="$(jq -r .version package.json)"
          # npm publish can return before the version is readable, and the MCP registry reads it from npm when it
          # validates the entry. Allow about 5 minutes, the limit codegraph's release workflow has proven.
          deadline=$((SECONDS + 300))
          while :; do
            if timeout 30 npm view "$name@$version" version >/dev/null 2>&1; then
              echo "verified $name@$version"
              exit 0
            fi
            [ "$SECONDS" -lt "$deadline" ] || break
            echo "waiting for $name@$version to appear"
            sleep 10
          done
          echo "::error::$name@$version never appeared on the npm registry"
          exit 1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$RUNNER_TEMP/$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$RUNNER_TEMP/$archive"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" mcp-publisher
      - name: Publish the MCP registry entry
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(jq -r .version package.json)"
          gh release create "$TAG" --verify-tag --latest --title "Swarmail $version" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Check that GitHub, npm and the MCP registry show the version
        run: bun run check:published
